    - generic [ref=f36e234]:
      - generic [ref=f36e235]:
        - generic [ref=f36e236]: Приём
        - generic [ref=f36e238]:
          - heading "Полтора часа, и ничего не делается без вашего согласия." [level=2] [ref=f36e240]
          - paragraph [ref=f36e242]: Первичная консультация длиннее обычного приёма, потому что состоит в основном из разговора. Мы собираем анамнез, осматриваем всё и объясняем, что нашли. Если нужно лечение, его назначают на другой день, чтобы вы успели уйти, подумать и решить, а не решали в кресле.
      - list [ref=f36e243]:
        - listitem [ref=f36e244]:
          - text: "01"
          - heading "До приёма" [level=3] [ref=f36e245]
          - paragraph [ref=f36e246]: Бланки приходят на почту сразу после записи. Если заполнить их дома, эти пятнадцать минут останутся осмотру. Парковка бесплатная, во дворе дома.
        - listitem [ref=f36e247]:
          - text: "02"
          - heading "Что взять с собой" [level=3] [ref=f36e248]
          - paragraph [ref=f36e249]: Паспорт, полис ДМС, список лекарств с дозировками и снимки из других клиник за последние два года. Если вам делали операцию на челюсти или вы принимаете препараты, разжижающие кровь, скажите об этом при записи.
        - listitem [ref=f36e250]:
          - text: "03"
          - heading "В кабинете" [level=3] [ref=f36e251]
          - paragraph [ref=f36e252]: "Полный осмотр: зубы, старые пломбы и коронки, дёсны, прикус, слизистая. Онкоскрининг входит сюда же. Если подошёл срок, делаем цифровые снимки. Всё, что видим мы, вы видите на экране рядом с креслом."
        - listitem [ref=f36e253]:
          - text: "04"
          - heading "Перед уходом" [level=3] [ref=f36e254]
          - paragraph [ref=f36e255]: "План лечения на бумаге: со сметой, с расчётом по ДМС и с честной пометкой, что нужно делать сейчас, что подождёт, а что разумнее не трогать вовсе."
      - generic [ref=f36e256]:
        - heading "ДМС-партнёры" [level=3] [ref=f36e258]
        - generic [ref=f36e259]:
          - list [ref=f36e260]:
            - listitem [ref=f36e261]: СОГАЗ
            - listitem [ref=f36e262]: «Ингосстрах»
            - listitem [ref=f36e263]: «РЕСО-Гарантия»
            - listitem [ref=f36e264]: «АльфаСтрахование»
            - listitem [ref=f36e265]: «Ренессанс Страхование»
            - listitem [ref=f36e266]: «Согласие»
            - listitem [ref=f36e267]: «Росгосстрах»
            - listitem [ref=f36e268]: ВСК
          - paragraph [ref=f36e269]: С этими компаниями мы работаем напрямую. С остальными нужно гарантийное письмо, и документы для страховой мы готовим сами. Смету согласуем со страховой до приёма, а не после него, поэтому цифра в плане и есть та, которую вы платите.
