        - generic [ref=f36e158]:
          - heading "Техника интересна только тем, что она убирает." [level=2] [ref=f36e160]
          - paragraph [ref=f36e162]: "Каждый пункт здесь избавляет приём от чего-то неприятного: от повторного приёма, от полного рта слепочной массы, от догадки."
      - img "Наконечники и инструменты на консоли стоматологической установки" [ref=f36e165]
      - generic [ref=f36e166]:
        - list [ref=f36e167]:
          - listitem [ref=f36e168]:
            - heading "КЛКТ" [level=3] [ref=f36e169]
            - paragraph [ref=f36e170]: Трёхмерный снимок делается до того, как названа цена импланта. План строится по вашей кости, а не по той, что бывает у большинства.
          - listitem [ref=f36e171]:
            - heading "Внутриротовое сканирование" [level=3] [ref=f36e172]
            - paragraph [ref=f36e173]: Тридцать секунд сканирования вместо ложки со слепочной массой. Без рвотного рефлекса, а на выходе получается файл, который можно отправить вам на почту.
          - listitem [ref=f36e174]:
            - heading "Керамика за один приём" [level=3] [ref=f36e175]
            - paragraph [ref=f36e176]: Коронку моделируют и вытачивают здесь же, примерно за час. В большинстве случаев временная коронка на две недели просто не нужна.
          - listitem [ref=f36e177]:
            - heading "Работа под увеличением" [level=3] [ref=f36e178]
            - paragraph [ref=f36e179]: С каналами и краями коронок работаем при увеличении от 4× и выше. Разница между реставрацией на пять лет и реставрацией на пятнадцать по большей части видна только на таком увеличении.
          - listitem [ref=f36e180]:
            - heading "Снимки и карта принадлежат вам" [level=3] [ref=f36e181]
            - paragraph [ref=f36e182]: Сканы, снимки и записи в карте остаются вашими. Попросите, и мы отправим их в тот же день, в формате, который откроет любая другая клиника.
        - paragraph [ref=f36e184]: Для больничного отделения всё это обычное дело. Необычно оно для клиники на три кресла. В этом и смысл.
