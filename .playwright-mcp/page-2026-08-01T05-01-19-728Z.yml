        - generic [ref=f28e192]:
          - heading "Техника интересна только тем, что она убирает." [level=2] [ref=f28e194]
          - paragraph [ref=f28e196]: "Каждый пункт здесь избавляет приём от чего-то неприятного: от повторного приёма, от полного рта слепочной массы, от догадки."
      - img "Наконечники и инструменты на консоли стоматологической установки" [ref=f28e199]
      - generic [ref=f28e200]:
        - list [ref=f28e201]:
          - listitem [ref=f28e202]:
            - heading "КЛКТ" [level=3] [ref=f28e203]
            - paragraph [ref=f28e204]: Трёхмерный снимок делается до того, как названа цена импланта. План строится по вашей кости, а не по той, что бывает у большинства.
          - listitem [ref=f28e205]:
            - heading "Внутриротовое сканирование" [level=3] [ref=f28e206]
            - paragraph [ref=f28e207]: Тридцать секунд сканирования вместо ложки со слепочной массой. Без рвотного рефлекса, а на выходе получается файл, который можно отправить вам на почту.
          - listitem [ref=f28e208]:
            - heading "Керамика за один приём" [level=3] [ref=f28e209]
            - paragraph [ref=f28e210]: Коронку моделируют и вытачивают здесь же, примерно за час. В большинстве случаев временная коронка на две недели просто не нужна.
          - listitem [ref=f28e211]:
            - heading "Работа под увеличением" [level=3] [ref=f28e212]
            - paragraph [ref=f28e213]: С каналами и краями коронок работаем при увеличении от 4× и выше. Разница между реставрацией на пять лет и реставрацией на пятнадцать по большей части видна только на таком увеличении.
          - listitem [ref=f28e214]:
            - heading "Снимки и карта принадлежат вам" [level=3] [ref=f28e215]
            - paragraph [ref=f28e216]: Сканы, снимки и записи в карте остаются вашими. Попросите, и мы отправим их в тот же день, в формате, который откроет любая другая клиника.
        - paragraph [ref=f28e218]: Для больничного отделения всё это обычное дело. Необычно оно для клиники на три кресла. В этом и смысл.
