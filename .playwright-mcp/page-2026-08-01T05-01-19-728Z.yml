            - listitem [ref=f28e302]: «Согласие»
            - listitem [ref=f28e303]: «Росгосстрах»
            - listitem [ref=f28e304]: ВСК
          - paragraph [ref=f28e305]: С этими компаниями мы работаем напрямую. С остальными нужно гарантийное письмо, и документы для страховой мы готовим сами. Смету согласуем со страховой до приёма, а не после него, поэтому цифра в плане и есть та, которую вы платите.
