      - generic [ref=f28e270]:
        - generic [ref=f28e271]: Приём
        - generic [ref=f28e274]:
          - heading "Полтора часа, и ничего не делается без вашего согласия." [level=2] [ref=f28e276]
          - paragraph [ref=f28e278]: Первичная консультация длиннее обычного приёма, потому что состоит в основном из разговора. Мы собираем анамнез, осматриваем всё и объясняем, что нашли. Если нужно лечение, его назначают на другой день, чтобы вы успели уйти, подумать и решить, а не решали в кресле.
      - list [ref=f28e279]:
        - listitem [ref=f28e280]:
          - text: "01"
          - heading "До приёма" [level=3] [ref=f28e281]
          - paragraph [ref=f28e282]: Бланки приходят на почту сразу после записи. Если заполнить их дома, эти пятнадцать минут останутся осмотру. Парковка бесплатная, во дворе дома.
        - listitem [ref=f28e283]:
          - text: "02"
          - heading "Что взять с собой" [level=3] [ref=f28e284]
          - paragraph [ref=f28e285]: Паспорт, полис ДМС, список лекарств с дозировками и снимки из других клиник за последние два года. Если вам делали операцию на челюсти или вы принимаете препараты, разжижающие кровь, скажите об этом при записи.
        - listitem [ref=f28e286]:
          - text: "03"
          - heading "В кабинете" [level=3] [ref=f28e287]
          - paragraph [ref=f28e288]: "Полный осмотр: зубы, старые пломбы и коронки, дёсны, прикус, слизистая. Онкоскрининг входит сюда же. Если подошёл срок, делаем цифровые снимки. Всё, что видим мы, вы видите на экране рядом с креслом."
        - listitem [ref=f28e289]:
          - text: "04"
          - heading "Перед уходом" [level=3] [ref=f28e290]
          - paragraph [ref=f28e291]: "План лечения на бумаге: со сметой, с расчётом по ДМС и с честной пометкой, что нужно делать сейчас, что подождёт, а что разумнее не трогать вовсе."
      - generic [ref=f28e292]:
        - heading "ДМС-партнёры" [level=3] [ref=f28e294]
        - generic [ref=f28e295]:
          - list [ref=f28e296]:
            - listitem [ref=f28e297]: СОГАЗ
            - listitem [ref=f28e298]: «Ингосстрах»
