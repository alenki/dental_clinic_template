        - generic [ref=f30e104]:
          - paragraph [ref=f30e106]: "«Покровку» открыла в 2011 году врач, у которой за плечами было девять лет сетевой практики: тридцать минут на приём гигиениста и пятнадцать на первичный осмотр. Замысел был простой. Делать ту же клиническую работу в том темпе, которого она требует, и посмотреть, что изменится."
          - paragraph [ref=f30e108]: Меняется в основном диагностика. Проблемы находятся, пока они ещё настолько малы, что лечатся сменой техники чистки. А вопрос, с которым пациенты на самом деле пришли, звучит обычно минут через восемь после того, как их в другом месте уже проводили бы до двери.
