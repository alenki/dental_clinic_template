      - generic [ref=f30e270]:
        - generic [ref=f30e271]: Приём
        - generic [ref=f30e274]:
          - heading "Полтора часа, и ничего не делается без вашего согласия." [level=2] [ref=f30e276]
          - paragraph [ref=f30e278]: Первичная консультация длиннее обычного приёма, потому что состоит в основном из разговора. Мы собираем анамнез, осматриваем всё и объясняем, что нашли. Если нужно лечение, его назначают на другой день, чтобы вы успели уйти, подумать и решить, а не решали в кресле.
      - list [ref=f30e279]:
        - listitem [ref=f30e280]:
          - text: "01"
          - heading "До приёма" [level=3] [ref=f30e281]
          - paragraph [ref=f30e282]: Бланки приходят на почту сразу после записи. Если заполнить их дома, эти пятнадцать минут останутся осмотру. Парковка бесплатная, во дворе дома.
        - listitem [ref=f30e283]:
          - text: "02"
          - heading "Что взять с собой" [level=3] [ref=f30e284]
          - paragraph [ref=f30e285]: Паспорт, полис ДМС, список лекарств с дозировками и снимки из других клиник за последние два года. Если вам делали операцию на челюсти или вы принимаете препараты, разжижающие кровь, скажите об этом при записи.
        - listitem [ref=f30e286]:
          - text: "03"
          - heading "В кабинете" [level=3] [ref=f30e287]
          - paragraph [ref=f30e288]: "Полный осмотр: зубы, старые пломбы и коронки, дёсны, прикус, слизистая. Онкоскрининг входит сюда же. Если подошёл срок, делаем цифровые снимки. Всё, что видим мы, вы видите на экране рядом с креслом."
        - listitem [ref=f30e289]:
          - text: "04"
          - heading "Перед уходом" [level=3] [ref=f30e290]
          - paragraph [ref=f30e291]: "План лечения на бумаге: со сметой, с расчётом по ДМС и с честной пометкой, что нужно делать сейчас, что подождёт, а что разумнее не трогать вовсе."
      - generic [ref=f30e292]:
        - heading "ДМС-партнёры" [level=3] [ref=f30e294]
        - generic [ref=f30e295]:
          - list [ref=f30e296]:
            - listitem [ref=f30e297]: СОГАЗ
            - listitem [ref=f30e298]: «Ингосстрах»
