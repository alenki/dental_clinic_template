            - listitem [ref=f30e301]: «Ренессанс Страхование»
            - listitem [ref=f30e302]: «Согласие»
            - listitem [ref=f30e303]: «Росгосстрах»
            - listitem [ref=f30e304]: ВСК
          - paragraph [ref=f30e305]: С этими компаниями мы работаем напрямую. С остальными нужно гарантийное письмо, и документы для страховой мы готовим сами. Смету согласуем со страховой до приёма, а не после него, поэтому цифра в плане и есть та, которую вы платите.
