  - main [ref=f38e22]:
    - generic [ref=f38e23]:
      - generic [ref=f38e24]: Услуги
      - heading "Седация и комфорт" [level=1] [ref=f38e27]
      - paragraph [ref=f38e29]: Для тех, кто откладывал это годами. Здесь об этом никто не скажет ни слова.
    - img "Пустой кабинет с креслом и светильником, светлый деревянный пол" [ref=f38e32]
    - paragraph [ref=f38e34]: Седация и комфорт · Покровский бульвар, 8
    - region [ref=f38e35]:
      - heading "Коротко об услуге" [level=2] [ref=f38e36]
      - generic [ref=f38e37]:
        - generic [ref=f38e38]:
          - paragraph [ref=f38e40]: Бояться стоматолога нормально. Как правило, за таким страхом стоит конкретный случай в кресле много лет назад, и лучше всего он проходит, когда его принимают всерьёз, а не уговаривают не бояться.
          - paragraph [ref=f38e42]: На практике это длинная первичная консультация, на которой ничего не делают, условный знак, которым вы в любую секунду всё останавливаете, и седация от закиси азота и таблеток до внутривенной, с анестезиологом в кабинете.
          - paragraph [ref=f38e44]: "И простые вещи: без бодрого «да там ничего страшного», без нотаций о состоянии ваших зубов и без единой процедуры, начатой раньше, чем вы скажете, что готовы."
        - generic [ref=f38e45]:
          - heading "На практике" [level=3] [ref=f38e46]
          - generic [ref=f38e47]:
            - generic [ref=f38e48]:
              - term [ref=f38e49]: Закись азота
              - definition [ref=f38e50]: От 4 500 ₽, домой за рулём
            - generic [ref=f38e51]:
              - term [ref=f38e52]: Таблетки
              - definition [ref=f38e53]: Нужен сопровождающий
            - generic [ref=f38e54]:
              - term [ref=f38e55]: Внутривенная
              - definition [ref=f38e56]: С анестезиологом
            - generic [ref=f38e57]:
              - term [ref=f38e58]: Консультация
              - definition [ref=f38e59]: Бесплатно, ничего не делаем
          - paragraph [ref=f38e60]: Это время, которое мы закладываем в расписание, а не время, на которое надеемся. Там, где стоит диапазон, письменный план, с которым вы уйдёте, называет вашу цифру.
          - link [ref=f38e62] [cursor=pointer]:
            - /url: /contact/
            - generic [ref=f38e64]:
              - text: Записаться
              - generic [ref=f38e65]: →
          - paragraph [ref=f38e66]:
            - text: Или позвоните по номеру
            - link "+7 (495) 120-14-80" [ref=f38e67] [cursor=pointer]:
              - /url: tel:+74951201480
            - text: и спросите, прежде чем на что-то записываться.
    - region "Кому это нужно" [ref=f38e68]:
      - generic [ref=f38e69]:
        - generic [ref=f38e70]: Кому это нужно
        - generic [ref=f38e72]:
          - heading "С чем сюда приходят." [level=2] [ref=f38e74]
          - paragraph [ref=f38e76]: "Здесь жалобы, а не разделы прайса: приходят обычно именно с ними. Если того, что привело вас, в списке нет, спросить всё равно стоит."
      - list [ref=f38e77]:
        - listitem [ref=f38e78]: Давний страх перед стоматологом
        - listitem [ref=f38e79]: Сильный рвотный рефлекс
        - listitem [ref=f38e80]: Местная анестезия плохо держит
        - listitem [ref=f38e81]: Долгие или сложные приёмы
        - listitem [ref=f38e82]: Чувствительность к звуку, свету, прикосновениям
        - listitem [ref=f38e83]: Годы отложенного лечения, которые надо нагнать
    - region "Как проходит приём" [ref=f38e84]:
      - generic [ref=f38e85]:
        - generic [ref=f38e86]: Как проходит приём
        - generic [ref=f38e88]:
          - heading "Что происходит и в каком порядке." [level=2] [ref=f38e90]
          - paragraph [ref=f38e92]: Ничего не начинается, пока это не объяснили, и остановить нас можно в любую секунду. Так на каждом приёме, а не только на первом.
      - list [ref=f38e93]:
        - listitem [ref=f38e94]:
          - generic [ref=f38e95]: "01"
          - heading "Разговор" [level=3] [ref=f38e96]
          - paragraph [ref=f38e97]: Первая встреча, на которой не происходит ничего, кроме разговора. Вы в своей одежде, кресло стоит вертикально.
        - listitem [ref=f38e98]:
          - generic [ref=f38e99]: "02"
          - heading "Выбор" [level=3] [ref=f38e100]
          - paragraph [ref=f38e101]: "Разбираем варианты: закись азота, таблетки, внутривенная седация. У каждого есть свои настоящие минусы, включая то, как пройдёт остаток дня."
        - listitem [ref=f38e102]:
          - generic [ref=f38e103]: "03"
          - heading "Условный знак" [level=3] [ref=f38e104]
          - paragraph [ref=f38e105]: Поднятая левая рука останавливает всё, сразу и каждый раз. Это не формальность, и мы это не обсуждаем.
        - listitem [ref=f38e106]:
          - generic [ref=f38e107]: "04"
          - heading "Лечение" [level=3] [ref=f38e108]
          - paragraph [ref=f38e109]: Во время седации идёт мониторинг пульсоксиметром. При внутривенной седации весь приём рядом находится отдельный анестезиолог.
        - listitem [ref=f38e110]:
          - generic [ref=f38e111]: "05"
          - heading "Отдых" [level=3] [ref=f38e112]
          - paragraph [ref=f38e113]: Вы отдыхаете в тихой комнате, пока не почувствуете себя уверенно. После всего, кроме закиси азота, нужно, чтобы вас отвезли домой.
    - region "Вопросы" [ref=f38e114]:
      - generic [ref=f38e115]:
        - generic [ref=f38e116]: Вопросы
        - generic [ref=f38e118]:
          - heading "Те, что задают чаще всего." [level=2] [ref=f38e120]
          - paragraph [ref=f38e122]: Собрали их здесь, чтобы они не съедали время приёма. Хотя переспросить в кабинете всё равно лучше, чем гадать.
