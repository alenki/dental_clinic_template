            - generic [ref=f31e90]: PDF · 2 страницы · 132 КБ
      - paragraph [ref=f31e92]: "Сайт демонстрационный: сами файлы к нему не подключены. На рабочем сайте эти четыре бланка уходили бы вам на почту сразу после записи."
    - generic [ref=f31e94]:
      - generic [ref=f31e95]:
        - generic [ref=f31e96]: ДМС
        - generic [ref=f31e99]:
          - heading "Напрямую работаем с 8 страховыми компаниями." [level=2] [ref=f31e101]
          - paragraph [ref=f31e103]: С этими компаниями мы работаем напрямую. С остальными нужно гарантийное письмо, и документы для страховой мы готовим сами. Смету согласуем со страховой до приёма, а не после него, поэтому цифра в плане и есть та, которую вы платите.
      - list [ref=f31e104]:
        - listitem [ref=f31e105]: СОГАЗ
        - listitem [ref=f31e106]: «Ингосстрах»
