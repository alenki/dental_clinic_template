    - generic [ref=f31e131]:
      - generic [ref=f31e132]:
        - generic [ref=f31e133]: Оплата
        - generic [ref=f31e136]:
          - heading "Пять способов оплатить большой план лечения." [level=2] [ref=f31e138]
          - paragraph [ref=f31e140]: Все пять указаны в смете сразу, а не достаются потом, чтобы спасти сумму, на которую вы уже сказали «нет».
      - list [ref=f31e141]:
        - listitem [ref=f31e142]:
          - heading "Оплата целиком" [level=3] [ref=f31e143]
          - paragraph [ref=f31e144]: Скидка 3% на план лечения дороже 50 000 ₽, если оплатить его сразу картой или через СБП.
        - listitem [ref=f31e145]:
          - heading "Рассрочка без процентов" [level=3] [ref=f31e146]
          - paragraph [ref=f31e147]: "План дороже 50 000 ₽ можно разделить на шесть равных платежей. Оформляем в клинике: ни банка, ни заявки на кредит, ни переплаты."
        - listitem [ref=f31e148]:
          - heading "Длинная рассрочка" [level=3] [ref=f31e149]
          - paragraph [ref=f31e150]: Имплантацию и протезирование всей челюсти можно растянуть на 12-36 месяцев в рассрочку банка-партнёра. Евгения Викторовна посчитает платёж вместе с вами до того, как вы подадите заявку.
        - listitem [ref=f31e151]:
          - heading "Налоговый вычет 13%" [level=3] [ref=f31e152]
          - paragraph [ref=f31e153]: Лечение зубов возвращает 13% от суммы. Справку об оплате медицинских услуг, договор и копию лицензии готовим сами. Вам остаётся приложить их к декларации.
        - listitem [ref=f31e154]:
          - heading "Абонемент без ДМС" [level=3] [ref=f31e155]
          - paragraph [ref=f31e156]: "28 000 ₽ в год: две профгигиены, осмотры, снимки и 20% скидки на лечение. Это не страховка, и годового лимита в нём нет."
      - paragraph [ref=f31e158]:
        - text: Выбранный вариант расписан в самом плане, рядом с расчётом по ДМС.
        - link "Попросите посчитать" [ref=f31e159] [cursor=pointer]:
          - /url: /contact
        - text: заранее, прежде чем вы на что-то согласитесь.
