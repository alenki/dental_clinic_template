  - main [ref=f31e23]:
    - generic [ref=f31e24]:
      - generic [ref=f31e25]: Пациентам
      - heading "Полтора часа, и ничего не делается без вашего согласия." [level=1] [ref=f31e29]
      - paragraph [ref=f31e31]: Первичная консультация длиннее обычного приёма, потому что состоит в основном из разговора. Мы собираем анамнез, осматриваем всё и объясняем, что нашли. Если нужно лечение, его назначают на другой день, чтобы вы успели уйти, подумать и решить, а не решали в кресле.
    - 'img "Зона ожидания: серые кресла под реечным деревянным потолком" [ref=f31e34]'
    - paragraph [ref=f31e36]: Зона ожидания · Покровский бульвар, 8
    - generic [ref=f31e37]:
      - generic [ref=f31e38]:
        - generic [ref=f31e39]: Первичный приём
        - generic [ref=f31e42]:
          - 'heading "Четыре части: от письма до плана, с которым вы уходите." [level=2] [ref=f31e44]'
          - paragraph [ref=f31e46]: Две из четырёх проходят до того, как вы сядете в кресло. Во многом поэтому все полтора часа в кабинете уходят на осмотр и разговор.
      - list [ref=f31e47]:
        - listitem [ref=f31e48]:
          - generic [ref=f31e49]: "01"
          - heading "До приёма" [level=3] [ref=f31e50]
          - paragraph [ref=f31e51]: Бланки приходят на почту сразу после записи. Если заполнить их дома, эти пятнадцать минут останутся осмотру. Парковка бесплатная, во дворе дома.
        - listitem [ref=f31e52]:
          - generic [ref=f31e53]: "02"
          - heading "Что взять с собой" [level=3] [ref=f31e54]
          - paragraph [ref=f31e55]: Паспорт, полис ДМС, список лекарств с дозировками и снимки из других клиник за последние два года. Если вам делали операцию на челюсти или вы принимаете препараты, разжижающие кровь, скажите об этом при записи.
        - listitem [ref=f31e56]:
          - generic [ref=f31e57]: "03"
          - heading "В кабинете" [level=3] [ref=f31e58]
          - paragraph [ref=f31e59]: "Полный осмотр: зубы, старые пломбы и коронки, дёсны, прикус, слизистая. Онкоскрининг входит сюда же. Если подошёл срок, делаем цифровые снимки. Всё, что видим мы, вы видите на экране рядом с креслом."
        - listitem [ref=f31e60]:
          - generic [ref=f31e61]: "04"
          - heading "Перед уходом" [level=3] [ref=f31e62]
          - paragraph [ref=f31e63]: "План лечения на бумаге: со сметой, с расчётом по ДМС и с честной пометкой, что нужно делать сейчас, что подождёт, а что разумнее не трогать вовсе."
    - generic [ref=f31e64]:
      - generic [ref=f31e65]:
        - generic [ref=f31e66]: Бланки
        - generic [ref=f31e69]:
          - heading "Четыре бланка приходят на почту сразу после записи." [level=2] [ref=f31e71]
          - paragraph [ref=f31e73]: Заполнение занимает минут пятнадцать, и дома они не съедают время приёма. Среди бланков есть согласие на обработку персональных данных по 152-ФЗ. Если удобнее от руки, распечатайте и принесите с собой.
      - list [ref=f31e74]:
        - listitem [ref=f31e75]:
          - generic [ref=f31e76]:
