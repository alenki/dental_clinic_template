        - listitem [ref=f31e112]: ВСК
      - generic [ref=f31e113]:
        - generic [ref=f31e114]:
          - heading "Как идут расчёты" [level=3] [ref=f31e115]
          - paragraph [ref=f31e116]: Евгения Викторовна проверяет покрытие до приёма, подаёт документы после и спорит со страховой, если пришёл отказ. Эта работа остаётся на клинике, а не возвращается вам.
