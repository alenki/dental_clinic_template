      - generic [ref=f34e236]:
        - generic [ref=f34e237]: Приём
        - generic [ref=f34e239]:
          - heading "Полтора часа, и ничего не делается без вашего согласия." [level=2] [ref=f34e241]
          - paragraph [ref=f34e243]: Первичная консультация длиннее обычного приёма, потому что состоит в основном из разговора. Мы собираем анамнез, осматриваем всё и объясняем, что нашли. Если нужно лечение, его назначают на другой день, чтобы вы успели уйти, подумать и решить, а не решали в кресле.
      - list [ref=f34e244]:
        - listitem [ref=f34e245]:
          - text: "01"
          - heading "До приёма" [level=3] [ref=f34e246]
          - paragraph [ref=f34e247]: Бланки приходят на почту сразу после записи. Если заполнить их дома, эти пятнадцать минут останутся осмотру. Парковка бесплатная, во дворе дома.
        - listitem [ref=f34e248]:
          - text: "02"
          - heading "Что взять с собой" [level=3] [ref=f34e249]
          - paragraph [ref=f34e250]: Паспорт, полис ДМС, список лекарств с дозировками и снимки из других клиник за последние два года. Если вам делали операцию на челюсти или вы принимаете препараты, разжижающие кровь, скажите об этом при записи.
        - listitem [ref=f34e251]:
          - text: "03"
          - heading "В кабинете" [level=3] [ref=f34e252]
          - paragraph [ref=f34e253]: "Полный осмотр: зубы, старые пломбы и коронки, дёсны, прикус, слизистая. Онкоскрининг входит сюда же. Если подошёл срок, делаем цифровые снимки. Всё, что видим мы, вы видите на экране рядом с креслом."
        - listitem [ref=f34e254]:
          - text: "04"
          - heading "Перед уходом" [level=3] [ref=f34e255]
          - paragraph [ref=f34e256]: "План лечения на бумаге: со сметой, с расчётом по ДМС и с честной пометкой, что нужно делать сейчас, что подождёт, а что разумнее не трогать вовсе."
      - generic [ref=f34e257]:
        - heading "ДМС-партнёры" [level=3] [ref=f34e259]
        - generic [ref=f34e260]:
          - list [ref=f34e261]:
            - listitem [ref=f34e262]: СОГАЗ
            - listitem [ref=f34e263]: «Ингосстрах»
            - listitem [ref=f34e264]: «РЕСО-Гарантия»
            - listitem [ref=f34e265]: «АльфаСтрахование»
            - listitem [ref=f34e266]: «Ренессанс Страхование»
            - listitem [ref=f34e267]: «Согласие»
            - listitem [ref=f34e268]: «Росгосстрах»
            - listitem [ref=f34e269]: ВСК
          - paragraph [ref=f34e270]: С этими компаниями мы работаем напрямую. С остальными нужно гарантийное письмо, и документы для страховой мы готовим сами. Смету согласуем со страховой до приёма, а не после него, поэтому цифра в плане и есть та, которую вы платите.
