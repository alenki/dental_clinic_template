          - heading "Техника интересна только тем, что она убирает." [level=2] [ref=f34e161]
          - paragraph [ref=f34e163]: "Каждый пункт здесь избавляет приём от чего-то неприятного: от повторного приёма, от полного рта слепочной массы, от догадки."
      - img "Наконечники и инструменты на консоли стоматологической установки" [ref=f34e166]
      - generic [ref=f34e167]:
        - list [ref=f34e168]:
          - listitem [ref=f34e169]:
            - heading "КЛКТ" [level=3] [ref=f34e170]
            - paragraph [ref=f34e171]: Трёхмерный снимок делается до того, как названа цена импланта. План строится по вашей кости, а не по той, что бывает у большинства.
          - listitem [ref=f34e172]:
            - heading "Внутриротовое сканирование" [level=3] [ref=f34e173]
            - paragraph [ref=f34e174]: Тридцать секунд сканирования вместо ложки со слепочной массой. Без рвотного рефлекса, а на выходе получается файл, который можно отправить вам на почту.
          - listitem [ref=f34e175]:
            - heading "Керамика за один приём" [level=3] [ref=f34e176]
            - paragraph [ref=f34e177]: Коронку моделируют и вытачивают здесь же, примерно за час. В большинстве случаев временная коронка на две недели просто не нужна.
          - listitem [ref=f34e178]:
            - heading "Работа под увеличением" [level=3] [ref=f34e179]
            - paragraph [ref=f34e180]: С каналами и краями коронок работаем при увеличении от 4× и выше. Разница между реставрацией на пять лет и реставрацией на пятнадцать по большей части видна только на таком увеличении.
          - listitem [ref=f34e181]:
            - heading "Снимки и карта принадлежат вам" [level=3] [ref=f34e182]
            - paragraph [ref=f34e183]: Сканы, снимки и записи в карте остаются вашими. Попросите, и мы отправим их в тот же день, в формате, который откроет любая другая клиника.
        - paragraph [ref=f34e185]: Для больничного отделения всё это обычное дело. Необычно оно для клиники на три кресла. В этом и смысл.
