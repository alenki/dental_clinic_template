        - generic [ref=f36e537]:
          - heading "Чего мы не делаем." [level=2] [ref=f36e539]
          - paragraph [ref=f36e541]: "Три пункта, названные прямо: их проще проверить, чем обещание."
      - list [ref=f36e542]:
        - listitem [ref=f36e543]:
          - heading "Без процента с плана" [level=3] [ref=f36e544]
          - paragraph [ref=f36e545]: Ни у кого здесь нет процента от вылеченного. У врачей оклад, и строчки в вашем плане лечения не меняют того, сколько кто получит в конце месяца.
        - listitem [ref=f36e546]:
          - heading "Без подписи в тот же день" [level=3] [ref=f36e547]
          - paragraph [ref=f36e548]: План лечения мы отдаём на бумаге, и вы уносите его с собой. Если что-то действительно срочно, мы скажем, насколько срочно. Этим всё и ограничится.
        - listitem [ref=f36e549]:
          - heading "Без эстетики вдогонку" [level=3] [ref=f36e550]
          - paragraph [ref=f36e551]: Тому, кто записался на чистку, никто не заводит разговор про виниры. Такой разговор начинаете вы, и тогда на отбеливание или виниры отведут отдельное время.
      - generic [ref=f36e552]:
        - paragraph [ref=f36e553]: "Об этих трёх спрашивают чаще всего. Четвёртый пункт письменно до записи можно попросить у Евгении Викторовны: всё, что оказывается на бумаге, проходит через неё."
