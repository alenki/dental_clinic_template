  - main [ref=f36e22]:
    - generic [ref=f36e374]:
      - generic [ref=f36e375]: О клинике
      - heading "Клиника на три кресла со своим расписанием." [level=1] [ref=f36e378]
      - paragraph [ref=f36e380]: Три кресла, пять человек и расписание, которое с 2011 года устроено одинаково. Дальше рассказано, как всё начиналось, кто здесь работает, как устроено помещение и чего мы решили не делать.
    - generic [ref=f36e381]:
      - generic [ref=f36e383]:
        - generic [ref=f36e384]: Начало
        - generic [ref=f36e386]:
          - heading "Всё началось с расписания, которое не сходилось." [level=2] [ref=f36e388]
          - paragraph [ref=f36e390]: На приём гигиениста тридцать минут, на осмотр нового пациента пятнадцать. Клинику открыли, чтобы изменить именно эту арифметику.
      - generic [ref=f36e391]:
        - generic [ref=f36e392]:
          - paragraph [ref=f36e394]: "«Покровка» открылась в 2011 году в одной комнате: одно кресло, гигиенист на полставки и список пациентов, которые обзванивали знакомых, выясняя, куда пропал их врач."
          - paragraph [ref=f36e396]: Дальше клиника росла медленно и намеренно. Второе кресло появилось в 2016 году, когда хирургия перешла внутрь клиники, а третье в 2019-м, под ортодонтию. На этом всё. Три кресла это тот размер, при котором гигиенист ещё помнит, как выглядели ваши дёсны в феврале прошлого года.
          - paragraph [ref=f36e398]: Клинический уклон тоже не менялся. Многое из того, что здесь восстанавливают, в другом месте уже предложили удалить, а примерно треть случаев с имплантами приходит за вторым мнением. Мы такой роли себе не выбирали. Так выходит, когда есть время посмотреть внимательно, прежде чем отвечать.
        - generic [ref=f36e399]:
          - img "Светлое помещение со встроенной мебелью и проёмом, за которым дневной свет" [ref=f36e401]
          - paragraph [ref=f36e402]: Приёмная · Покровский бульвар, 8
      - generic [ref=f36e404]:
        - generic [ref=f36e405]:
          - term [ref=f36e406]: "2011"
          - definition [ref=f36e407]: Год открытия клиники
        - generic [ref=f36e408]:
          - term [ref=f36e409]: "60"
          - definition [ref=f36e410]: Минут в обычном приёме гигиениста
        - generic [ref=f36e411]:
          - term [ref=f36e412]: "3"
          - definition [ref=f36e413]: Врача, и вы остаётесь у одного
        - generic [ref=f36e414]:
          - term [ref=f36e415]: 9 400
          - definition [ref=f36e416]: Пациентов за всё время
    - generic [ref=f36e417]:
      - generic [ref=f36e419]:
        - generic [ref=f36e420]: Врачи
        - generic [ref=f36e422]:
          - heading "Пять человек, и с 2019 года список не менялся." [level=2] [ref=f36e424]
          - paragraph [ref=f36e426]: Все они здесь каждую неделю. Приходящих врачей по сменам нет, поэтому в марте вас смотрит тот же человек, что и в сентябре.
      - generic [ref=f36e427]:
        - article [ref=f36e428]:
          - img "Осипова Анна Ильинична" [ref=f36e431]
          - generic [ref=f36e432]:
            - heading "Осипова Анна Ильинична" [level=3] [ref=f36e433]
            - paragraph [ref=f36e434]:
              - generic [ref=f36e435]: Основатель · стоматолог-ортопед, имплантолог
              - generic [ref=f36e436]: В клинике с 2011 года
            - paragraph [ref=f36e437]: Осипова окончила МГМСУ имени Евдокимова и ординатуру по ортопедической стоматологии, а потом девять лет проработала в сетевой клинике, где на приём гигиениста отводили тридцать минут, а на первичный осмотр всего пятнадцать. «Покровка» открылась в 2011 году, чтобы посмотреть, как выглядит та же работа, если убрать из неё секундомер.
            - paragraph [ref=f36e438]: "Клинически это реставрация и имплантация: восстановить зуб, который в другом месте уже предложили удалить, и заменить тот, который действительно не спасти. Примерно треть случаев с имплантами приходит сюда за вторым мнением."
            - paragraph [ref=f36e439]: Держит в кабинете полку с неудачными работами (по большей части своими ранними) и покажет её, если спросить, что может пойти не так.
        - article [ref=f36e440]:
          - img "Марченко Илья Сергеевич" [ref=f36e443]
          - generic [ref=f36e444]:
            - heading "Марченко Илья Сергеевич" [level=3] [ref=f36e445]
            - paragraph [ref=f36e446]:
              - generic [ref=f36e447]: Стоматолог-хирург, пародонтолог
              - generic [ref=f36e448]: В клинике с 2016 года
            - paragraph [ref=f36e449]: "Марченко пришёл в «Покровку» в 2016 году из отделения челюстно-лицевой хирургии городской больницы и до сих пор один день в месяц преподаёт ординаторам. Через это кресло идёт вся хирургия клиники: удаления, костная пластика, операции на дёснах."
            - paragraph [ref=f36e450]: "Отдельно ему интересен пародонтит: медленная и безболезненная потеря кости, которая держит зуб. Большинство замечает это, только когда зуб начинает шататься. Если поймать рано, болезнь держат под контролем десятилетиями."
            - paragraph [ref=f36e451]: Отговорит от удаления, если зуб можно сохранить хоть сколько-нибудь разумной ценой, а на вопрос про зубы мудрости у него готов развёрнутый письменный ответ, почему большинству из них удаление не нужно.
        - article [ref=f36e452]:
          - img "Хайдарова Нурия Ринатовна" [ref=f36e455]
          - generic [ref=f36e456]:
            - heading "Хайдарова Нурия Ринатовна" [level=3] [ref=f36e457]
            - paragraph [ref=f36e458]:
              - generic [ref=f36e459]: Врач-ортодонт
              - generic [ref=f36e460]: В клинике с 2019 года
            - paragraph [ref=f36e461]: Хайдарова пришла в 2019 году и взяла на себя ортодонтию. До этого почти всех отправляли к коллегам в другие клиники. Сейчас элайнеры ведутся целиком здесь, а там, где нужна несъёмная техника, ставят брекеты.
            - paragraph [ref=f36e462]: Приходят в основном взрослые, и многие носили брекеты подростками, а потом смотрели, как зубы понемногу разъезжаются после того, как перестали носить ретейнер. Задача понятная, лечение обычно короткое.
            - paragraph [ref=f36e463]: "Примерно каждому пятому, кто приходит за элайнерами, отказывает: случай не тот. Предпочитает потерять пациента, а не результат."
        - article [ref=f36e464]:
          - img "Рагозина Полина Андреевна" [ref=f36e467]
          - generic [ref=f36e468]:
            - heading "Рагозина Полина Андреевна" [level=3] [ref=f36e469]
            - paragraph [ref=f36e470]:
              - generic [ref=f36e471]: Старший гигиенист
              - generic [ref=f36e472]: В клинике с 2013 года
            - paragraph [ref=f36e473]: Рагозина работает здесь с 2013 года и видит большинство постоянных пациентов дважды в год, поэтому именно в её кресле перемены и замечают. Мелкие сдвиги в состоянии дёсен всплывают тут первыми.
            - paragraph [ref=f36e474]: "Она же решает, как в клинике принимают тревожных пациентов на гигиене: приёмы короче, а самих приёмов больше, когда человеку нужно именно это, чтобы спокойно приходить снова."
            - paragraph [ref=f36e475]: Считает, что важнее не то, как часто вы пользуетесь нитью, а то, как именно. И скорее покажет руками, чем объяснит словами.
        - article [ref=f36e476]:
          - img "Уварова Евгения Викторовна" [ref=f36e479]
          - generic [ref=f36e480]:
            - heading "Уварова Евгения Викторовна" [level=3] [ref=f36e481]
            - paragraph [ref=f36e482]:
              - generic [ref=f36e483]: Управляющая клиникой
              - generic [ref=f36e484]: В клинике с 2014 года
            - paragraph [ref=f36e485]: "Уварова управляет клиникой с 2014 года: на ней запись, ДМС и сметы. К каждому плану лечения прилагается письменная смета: что закрывает страховая, а что придётся оплатить самому."
            - paragraph [ref=f36e486]: Если страховая отказывает, спорит с ней Уварова, а не пациент. Она же готовит справку для налогового вычета, те самые 13%, которые чаще всего не возвращают просто потому, что не дошли до бумаг.
            - paragraph [ref=f36e487]: Скажет, если лечение выгоднее перенести на январь, под новый лимит по ДМС. Клинике это, строго говоря, невыгодно.
    - generic [ref=f36e488]:
      - generic [ref=f36e490]:
        - generic [ref=f36e491]: Помещение
        - generic [ref=f36e493]:
          - heading "Дорога до кресла не должна быть самой трудной частью приёма." [level=2] [ref=f36e495]
          - paragraph [ref=f36e497]: Вход со двора, без единой ступени. Есть лифт до этажа клиники и кабинет, оборудованный для маломобильных пациентов. Скажите при записи, и приём поставят именно в него.
      - generic [ref=f36e498]:
        - generic [ref=f36e499]:
          - img "Два кресла и растение у стены из деревянных реек" [ref=f36e501]
          - paragraph [ref=f36e502]: Зона ожидания · окна на бульвар
        - generic [ref=f36e503]:
          - img "Коридор между кабинетами" [ref=f36e505]
          - paragraph [ref=f36e506]: Коридор ко второму и третьему кабинетам
      - generic [ref=f36e507]:
        - generic [ref=f36e508]:
          - paragraph [ref=f36e510]: "Почти все заходят со двора, а не с бульвара. От машины до двери нет ни одной ступени, лифт сразу за ней. Парковка во дворе бесплатная: ни талона под лобовое стекло, ни отметки на стойке администратора."
          - paragraph [ref=f36e512]: "На этаже три кабинета. Третий оборудован для маломобильных пациентов и заодно самый тихий, поэтому длинные приёмы обычно ставят в него. В зоне ожидания восемь мест, и заняты бывают редко больше трёх: расписание собрано так, чтобы приёмы не накладывались один на другой."
